server:
  port: 8082
spring:
  application:
    name: workflow-orchestrator
services:
  inventory:
    url: http://resource-inventory-service:8084
    connect-timeout-ms: 30000
    read-timeout-ms: 30000
resilience4j:
  circuitbreaker:
    instances:
      inventoryClient:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
