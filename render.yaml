# ==============================================================================
# JiraPilot AI - Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Java 21 Spring Boot Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: jirapilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DEMO_MODE
        value: "true"
      - key: EMAILJS_ENABLED
        value: "true"
      - key: EMAILJS_SERVICE_ID
        value: service_1ooa8fh
      - key: EMAILJS_TEMPLATE_ID
        value: template_ohed206
      - key: EMAILJS_PUBLIC_KEY
        value: F84AMnSi5B2E8awRT
      - key: JIRA_BASE_URL
        value: https://siva-shankaran.atlassian.net
      - key: JIRA_EMAIL
        value: sshankaran202@gmail.com
      - key: JIRA_PROJECT_KEY
        value: KAN
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: jirapilot-ai-service
          property: host

  # ----------------------------------------------------------------------------
  # 2. Python 3.12 FastAPI AI Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: jirapilot-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: deterministic
